# Render blueprint.
#
# One web service. FastAPI serves the JSON API *and* the dashboard, which is
# plain static HTML/CSS/JS with no build step. Since the two share an origin
# the browser makes no cross-origin request, so there is no API base URL to
# configure and no CORS preflight to get wrong.
#
# Deploy with: Render Dashboard -> New -> Blueprint -> pick this repo.
#
# If you would rather host the dashboard on Render's static-site CDN as a
# second service, see "Splitting the dashboard onto its own service" in the
# README — frontend/ is already a self-contained static bundle.

services:
  - type: web
    name: airport-intelligence
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ANTHROPIC_API_KEY
        sync: false          # set this in the Render dashboard; never in git
      - key: USE_DEMO_DATA
        value: "true"        # flip to false once a live BTS extract is wired up
      - key: LONG_HAUL_MILES
        value: "2500"
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ALLOW_ORIGINS
        value: "*"           # only needed if you split the dashboard out
